<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramp Designer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Quarter Pipe Designer</h1>
  </header>

  <main>
    <form id="ramp-form" autocomplete="off">
      <div class="form-row">
        <fieldset class="units">
          <legend>Ramp units</legend>
          <label class="radio"><input type="radio" name="units" value="cm"> cm</label>
          <label class="radio"><input type="radio" name="units" value="ft" checked> ft</label>
        </fieldset>
        <label>
          <span>Height (<span class="unit-name">ft</span>)</span>
          <input id="height" type="number" min="0" step="any" value="3" required>
        </label>
        <label>
          <span>Transition radius (<span class="unit-name">ft</span>)</span>
          <input id="radius" type="number" min="0" step="any" value="5" required>
        </label>
      </div>
      <div class="form-row">
        <fieldset class="units">
          <legend>Coping units</legend>
          <label class="radio"><input type="radio" name="coping-units" value="mm"> mm</label>
          <label class="radio"><input type="radio" name="coping-units" value="in" checked> in</label>
        </fieldset>
        <label>
          <span>Coping outside diameter (<span class="coping-unit-name">in</span>)</span>
          <input id="coping" type="number" min="0" step="any" value="2.375" required>
        </label>
      </div>
      <div class="form-row">
        <fieldset class="units">
          <legend>Protrusion units</legend>
          <label class="radio"><input type="radio" name="protrusion-units" value="mm"> mm</label>
          <label class="radio"><input type="radio" name="protrusion-units" value="in" checked> in</label>
        </fieldset>
        <label>
          <span>Coping protrusion above deck (<span class="protrusion-unit-name">in</span>)</span>
          <input id="coping-above-deck" type="number" step="any" value="0.375" required>
        </label>
        <label>
          <span>Coping protrusion from ramp (<span class="protrusion-unit-name">in</span>)</span>
          <input id="coping-from-ramp" type="number" step="any" value="0.125" required>
        </label>
      </div>
    </form>

    <section class="results">
      <div class="stat">
        <span class="stat-label">Angle at top</span>
        <span class="stat-value" id="angle-out">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">Length of ramp surface</span>
        <span class="stat-value" id="arc-out">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">Length along ground</span>
        <span class="stat-value" id="length-out">–</span>
      </div>
      <div class="stat" id="vert-stat" hidden>
        <span class="stat-label">Vertical section</span>
        <span class="stat-value" id="vert-out">–</span>
      </div>
    </section>

    <p class="error" id="error" hidden></p>

    <div class="canvas-wrap">
      <canvas id="ramp-canvas"></canvas>
    </div>

    <h2>Coping detail</h2>
    <div class="canvas-wrap">
      <canvas id="detail-canvas" class="detail"></canvas>
    </div>
  </main>

  <script src="ramp.js"></script>
</body>
</html>
