<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramp Designer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Quarter Pipe Designer</h1>
  </header>

  <main>
    <form id="ramp-form" autocomplete="off">
      <fieldset class="units">
        <legend>Units</legend>
        <label class="radio"><input type="radio" name="units" value="cm"> cm</label>
        <label class="radio"><input type="radio" name="units" value="ft" checked> ft</label>
      </fieldset>
      <label>
        <span>Height (<span class="unit-name">ft</span>)</span>
        <input id="height" type="number" min="0" step="any" value="3" required>
      </label>
      <label>
        <span>Transition radius (<span class="unit-name">ft</span>)</span>
        <input id="radius" type="number" min="0" step="any" value="5" required>
      </label>
    </form>

    <section class="results">
      <div class="stat">
        <span class="stat-label">Angle at top</span>
        <span class="stat-value" id="angle-out">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">Length of ramp surface</span>
        <span class="stat-value" id="arc-out">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">Length along ground</span>
        <span class="stat-value" id="length-out">–</span>
      </div>
      <div class="stat" id="vert-stat" hidden>
        <span class="stat-label">Vertical section</span>
        <span class="stat-value" id="vert-out">–</span>
      </div>
    </section>

    <p class="error" id="error" hidden></p>

    <div class="canvas-wrap">
      <canvas id="ramp-canvas"></canvas>
    </div>
  </main>

  <script src="ramp.js"></script>
</body>
</html>
